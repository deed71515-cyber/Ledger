<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Your Ledger</title>
<meta name="theme-color" content="#2F6F5E" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F6F3EC; }
  #root { min-height: 100vh; }
  .ledger-input:focus, .ledger-btn:focus { outline: 2px solid #B98A2E; outline-offset: 2px; }
  .ledger-slider { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: #E4DFD1; width: 100%; }
  .ledger-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; cursor: pointer; }
  .ledger-slider::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script>
  // Local storage shim matching the window.storage interface used inside the component
  window.storage = {
    get: async (key) => {
      const raw = localStorage.getItem(key);
      if (raw === null) return null;
      return { key, value: raw, shared: false };
    },
    set: async (key, value) => {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    delete: async (key) => {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    list: async (prefix) => {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    },
  };

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

const STORAGE_KEY = 'ledger-state-v1';

const PAPER = '#F6F3EC';
const INK = '#1C2B22';
const MUTED = '#5F5947';
const CARD = '#FFFFFF';
const BORDER = '#E4DFD1';
const BRICK = '#A8483A';
const GOLD = '#B98A2E';

const SERIF = "'Fraunces', Georgia, serif";
const SANS = "'IBM Plex Sans', system-ui, sans-serif";

const DEFAULT_CATEGORIES = [
  { id: 'essentials', name: 'Essentials', pct: 10, color: '#6B7B58' },
  { id: 'guiltfree', name: 'Guilt-Free', pct: 5, color: '#C9A227' },
  { id: 'debtinvest', name: 'Debt / Invest', pct: 10, color: '#2F6F5E' },
  { id: 'shortterm', name: 'Short-Term Buffer', pct: 15, color: '#B5651D' },
  { id: 'longterm', name: 'Long-Term Wealth', pct: 15, color: '#3E5C76' },
];

function monthKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function monthLabel(key) {
  const [y, m] = key.split('-').map(Number);
  const d = new Date(y, m - 1, 1);
  return d.toLocaleString('en', { month: 'long', year: 'numeric' });
}

function formatGHS(n) {
  const sign = n < 0 ? '-' : '';
  return `${sign}GHC ${Math.abs(Math.round(n)).toLocaleString('en')}`;
}

function Ledger() {
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState(false);
  const [income, setIncome] = useState(3500);
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [months, setMonths] = useState({});
  const [activeMonth, setActiveMonth] = useState(monthKey(new Date()));
  const [openForm, setOpenForm] = useState(null);
  const [formAmount, setFormAmount] = useState('');
  const [formNote, setFormNote] = useState('');

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          if (parsed.income) setIncome(parsed.income);
          if (parsed.categories) setCategories(parsed.categories);
          if (parsed.months) setMonths(parsed.months);
        }
      } catch (e) {
        // no saved ledger yet, start fresh
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const persist = useCallback(async (nextIncome, nextCategories, nextMonths) => {
    try {
      const result = await window.storage.set(
        STORAGE_KEY,
        JSON.stringify({ income: nextIncome, categories: nextCategories, months: nextMonths }),
        false
      );
      setSaveError(!result);
    } catch (e) {
      setSaveError(true);
    }
  }, []);

  function handleIncomeChange(value) {
    const n = Math.max(0, Number(value) || 0);
    setIncome(n);
    persist(n, categories, months);
  }

  function handlePctChange(id, value) {
    const n = Math.max(0, Math.min(100, Number(value)));
    const next = categories.map((c) => (c.id === id ? { ...c, pct: n } : c));
    setCategories(next);
    persist(income, next, months);
  }

  function ensureMonth(key, monthsObj) {
    if (monthsObj[key]) return monthsObj;
    return { ...monthsObj, [key]: { transactions: [] } };
  }

  function addTransaction(categoryId) {
    const amt = Number(formAmount);
    if (!amt || amt <= 0) return;
    const withMonth = ensureMonth(activeMonth, months);
    const tx = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      categoryId,
      amount: amt,
      note: formNote.trim(),
      date: new Date().toISOString(),
    };
    const nextMonths = {
      ...withMonth,
      [activeMonth]: { transactions: [tx, ...withMonth[activeMonth].transactions] },
    };
    setMonths(nextMonths);
    persist(income, categories, nextMonths);
    setFormAmount('');
    setFormNote('');
    setOpenForm(null);
  }

  function deleteTransaction(txId) {
    const list = months[activeMonth]?.transactions || [];
    const nextMonths = {
      ...months,
      [activeMonth]: { transactions: list.filter((t) => t.id !== txId) },
    };
    setMonths(nextMonths);
    persist(income, categories, nextMonths);
  }

  async function handleReset() {
    if (!window.confirm('Clear all saved ledger data? This cannot be undone.')) return;
    setIncome(3500);
    setCategories(DEFAULT_CATEGORIES);
    setMonths({});
    setActiveMonth(monthKey(new Date()));
    try {
      await window.storage.delete(STORAGE_KEY, false);
    } catch (e) {}
  }

  function handleExportCSV() {
    const rows = [['Month', 'Date', 'Category', 'Amount (GHC)', 'Note']];
    Object.keys(months).sort().forEach((mKey) => {
      const txs = months[mKey]?.transactions || [];
      txs.slice().reverse().forEach((t) => {
        const cat = categories.find((c) => c.id === t.categoryId);
        const dateStr = new Date(t.date).toLocaleDateString('en-GB');
        const noteEscaped = (t.note || '').replace(/"/g, '""');
        rows.push([mKey, dateStr, cat?.name || 'Unknown', t.amount, `"${noteEscaped}"`]);
      });
    });
    const csvContent = rows.map((r) => r.join(',')).join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ledger-export-${monthKey(new Date())}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  const currentTx = months[activeMonth]?.transactions || [];
  const totalAllocatedPct = categories.reduce((s, c) => s + c.pct, 0);
  const overAllocated = totalAllocatedPct > 100;
  const totalPlanned = income * (Math.min(totalAllocatedPct, 100) / 100);
  const unallocatedAmount = income - totalPlanned;
  const totalSpent = currentTx.reduce((s, t) => s + t.amount, 0);

  const availableMonths = Array.from(
    new Set([...Object.keys(months), monthKey(new Date())])
  ).sort();
  const monthIdx = availableMonths.indexOf(activeMonth);

  function goMonth(delta) {
    const idx = monthIdx + delta;
    if (idx >= 0 && idx < availableMonths.length) setActiveMonth(availableMonths[idx]);
  }

  if (loading) {
    return (
      <div style={{ background: PAPER, minHeight: '100vh', fontFamily: SANS }} className="flex items-center justify-center p-12">
        <p style={{ color: MUTED }}>Opening the ledger…</p>
      </div>
    );
  }

  return (
    <div style={{ background: PAPER, fontFamily: SANS, color: INK, width: '100%', boxSizing: 'border-box', minHeight: '100vh' }}>
      <div style={{ maxWidth: 640, margin: '0 auto', padding: '32px 20px' }}>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 16, marginBottom: 32 }}
             className="header-row">
          <div>
            <h1 style={{ fontFamily: SERIF, fontSize: '1.75rem', fontWeight: 600, margin: 0 }}>Your Ledger</h1>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginTop: 4 }}>
              <button onClick={() => goMonth(-1)} disabled={monthIdx <= 0}
                style={{ color: monthIdx <= 0 ? BORDER : MUTED, background: 'none', border: 'none', cursor: monthIdx <= 0 ? 'default' : 'pointer', fontSize: '1rem' }}>‹</button>
              <span style={{ color: MUTED, fontSize: '0.9rem' }}>{monthLabel(activeMonth)}</span>
              <button onClick={() => goMonth(1)} disabled={monthIdx >= availableMonths.length - 1}
                style={{ color: monthIdx >= availableMonths.length - 1 ? BORDER : MUTED, background: 'none', border: 'none', cursor: monthIdx >= availableMonths.length - 1 ? 'default' : 'pointer', fontSize: '1rem' }}>›</button>
            </div>
          </div>
          <div>
            <label style={{ color: MUTED, fontSize: '0.8rem' }}>Monthly income</label>
            <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginTop: 4 }}>
              <span style={{ fontFamily: SERIF }}>GHC</span>
              <input type="number" value={income} onChange={(e) => handleIncomeChange(e.target.value)}
                className="ledger-input"
                style={{ fontFamily: SERIF, fontSize: '1.1rem', width: 110, background: 'transparent', border: `1px solid ${BORDER}`, borderRadius: 6, padding: '4px 8px', color: INK }} />
            </div>
          </div>
        </div>

        <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: 24, marginBottom: 32 }}>
          <p style={{ color: MUTED, fontSize: '0.85rem', margin: '0 0 4px' }}>Still unaccounted for this month</p>
          <p style={{ fontFamily: SERIF, fontSize: '2.5rem', fontWeight: 500, lineHeight: 1.1, color: unallocatedAmount < 0 ? BRICK : INK, margin: 0 }}>
            {formatGHS(unallocatedAmount)}
          </p>
          <div style={{ display: 'flex', gap: 32, marginTop: 20, paddingTop: 20, borderTop: `1px solid ${BORDER}` }}>
            <div>
              <p style={{ color: MUTED, fontSize: '0.8rem', margin: 0 }}>Planned</p>
              <p style={{ fontFamily: SERIF, fontSize: '1.25rem', margin: 0 }}>{formatGHS(totalPlanned)}</p>
            </div>
            <div>
              <p style={{ color: MUTED, fontSize: '0.8rem', margin: 0 }}>Spent so far</p>
              <p style={{ fontFamily: SERIF, fontSize: '1.25rem', margin: 0 }}>{formatGHS(totalSpent)}</p>
            </div>
          </div>
          {overAllocated && (
            <p style={{ color: BRICK, fontSize: '0.85rem', marginTop: 16, marginBottom: 0 }}>
              Your categories add up to {totalAllocatedPct}% — that's over 100%. Adjust a slider below.
            </p>
          )}
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 16, marginBottom: 32 }}>
          {categories.map((c) => {
            const planned = income * (c.pct / 100);
            const spent = currentTx.filter((t) => t.categoryId === c.id).reduce((s, t) => s + t.amount, 0);
            const remaining = planned - spent;
            const usedPct = planned > 0 ? Math.min(100, (spent / planned) * 100) : 0;
            const isOver = spent > planned;
            const isOpen = openForm === c.id;

            return (
              <div key={c.id} style={{ background: CARD, border: `1px solid ${BORDER}`, borderLeft: `4px solid ${c.color}`, borderRadius: 8, padding: 18 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                  <span style={{ fontWeight: 600, fontSize: '0.95rem' }}>{c.name}</span>
                  <span style={{ color: MUTED, fontSize: '0.85rem' }}>{c.pct}%</span>
                </div>
                <input type="range" min="0" max="40" value={c.pct} onChange={(e) => handlePctChange(c.id, e.target.value)}
                  className="ledger-slider"
                  style={{ accentColor: c.color, background: `linear-gradient(to right, ${c.color} ${(c.pct/40)*100}%, ${BORDER} ${(c.pct/40)*100}%)` }} />

                <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8, fontSize: '0.8rem' }}>
                  <span style={{ color: MUTED }}>Planned {formatGHS(planned)}</span>
                  <span style={{ color: isOver ? BRICK : MUTED }}>
                    {isOver ? `Over by ${formatGHS(spent - planned)}` : `${formatGHS(remaining)} left`}
                  </span>
                </div>

                <div style={{ background: BORDER, borderRadius: 4, height: 6, overflow: 'hidden', marginTop: 8 }}>
                  <div style={{ width: `${usedPct}%`, background: isOver ? BRICK : c.color, height: '100%', transition: 'width 300ms ease' }} />
                </div>

                <div style={{ marginTop: 12 }}>
                  {!isOpen ? (
                    <button onClick={() => { setOpenForm(c.id); setFormAmount(''); setFormNote(''); }}
                      style={{ color: c.color, background: 'none', border: 'none', fontSize: '0.85rem', cursor: 'pointer', fontWeight: 500, padding: 0 }}>
                      + Add entry
                    </button>
                  ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginTop: 8 }}>
                      <input type="number" placeholder="Amount" value={formAmount}
                        onChange={(e) => setFormAmount(e.target.value)}
                        onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addTransaction(c.id); } }}
                        className="ledger-input" autoFocus
                        style={{ border: `1px solid ${BORDER}`, borderRadius: 6, padding: '8px', fontSize: '0.85rem', width: '100%' }} />
                      <input type="text" placeholder="Note (optional)" value={formNote}
                        onChange={(e) => setFormNote(e.target.value)}
                        onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addTransaction(c.id); } }}
                        className="ledger-input"
                        style={{ border: `1px solid ${BORDER}`, borderRadius: 6, padding: '8px', fontSize: '0.85rem', width: '100%' }} />
                      <div style={{ display: 'flex', gap: 8 }}>
                        <button onClick={() => addTransaction(c.id)}
                          style={{ background: c.color, color: '#FFF', border: 'none', borderRadius: 6, padding: '8px 16px', fontSize: '0.85rem', cursor: 'pointer' }}>Save</button>
                        <button onClick={() => setOpenForm(null)}
                          style={{ background: 'none', color: MUTED, border: 'none', fontSize: '0.85rem', cursor: 'pointer' }}>Cancel</button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>

        <div style={{ marginBottom: 32 }}>
          <h2 style={{ fontFamily: SERIF, fontSize: '1.1rem', fontWeight: 600, marginBottom: 12 }}>Entries this month</h2>
          {currentTx.length === 0 ? (
            <p style={{ color: MUTED, fontSize: '0.85rem' }}>No entries yet. Add one from a category above.</p>
          ) : (
            <div style={{ border: `1px solid ${BORDER}`, borderRadius: 8, background: CARD }}>
              {currentTx.map((t, i) => {
                const cat = categories.find((c) => c.id === t.categoryId);
                return (
                  <div key={t.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 16px', borderTop: i === 0 ? 'none' : `1px solid ${BORDER}` }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 12, minWidth: 0 }}>
                      <span style={{ width: 8, height: 8, borderRadius: '50%', background: cat?.color || MUTED, flexShrink: 0 }} />
                      <div style={{ minWidth: 0 }}>
                        <p style={{ fontSize: '0.85rem', margin: 0 }}>{cat?.name || 'Unknown'}</p>
                        {t.note && <p style={{ color: MUTED, fontSize: '0.75rem', margin: 0 }}>{t.note}</p>}
                      </div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexShrink: 0 }}>
                      <span style={{ fontFamily: SERIF, fontSize: '0.9rem' }}>{formatGHS(t.amount)}</span>
                      <button onClick={() => deleteTransaction(t.id)}
                        style={{ color: MUTED, background: 'none', border: 'none', cursor: 'pointer', fontSize: '0.9rem' }}>×</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingTop: 16, borderTop: `1px solid ${BORDER}` }}>
          <span style={{ color: saveError ? BRICK : BORDER, fontSize: '0.75rem' }}>
            {saveError ? "Couldn't save — check your connection" : ' '}
          </span>
          <div style={{ display: 'flex', gap: 16 }}>
            <button onClick={handleExportCSV} style={{ color: GOLD, background: 'none', border: 'none', fontSize: '0.75rem', cursor: 'pointer', fontWeight: 500 }}>Export CSV</button>
            <button onClick={handleReset} style={{ color: MUTED, background: 'none', border: 'none', fontSize: '0.75rem', cursor: 'pointer', textDecoration: 'underline' }}>Reset ledger</button>
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Ledger />);
</script>
</body>
</html>
