<!DOCTYPE html>

  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  .ledger-input:focus, .ledger-btn:focus { outline: 2px solid #B98A2E; outline-offset: 2px; }
  .ledger-slider { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: #E4DFD1; width: 100%; touch-action: pan-y; }
  .ledger-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; cursor: pointer; }
  .ledger-slider::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer; }

<body>
<div id="root"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>

<script>
  // Local storage shim matching the window.storage interface used inside the component
  window.storage = {
    get: async (key) => {
      const raw = localStorage.getItem(key);
      if (raw === null) return null;
      return { key, value: raw, shared: false };
    },
    set: async (key, value) => {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    delete: async (key) => {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    list: async (prefix) => {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    },
  };

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

<script type="text/plain" id="app-source">const { useState, useEffect, useCallback, useRef } = React;

const STORAGE_KEY = 'ledger-state-v3';

const PAPER = '#F6F3EC';
const INK = '#1C2B22';
const MUTED = '#5F5947';
const CARD = '#FFFFFF';
const BORDER = '#E4DFD1';
const BRICK = '#A8483A';
const GOLD = '#B98A2E';
const FOREST = '#2F6F5E';

const SERIF = "'Fraunces', Georgia, serif";
const SANS = "'IBM Plex Sans', system-ui, sans-serif";

const DEFAULT_CATEGORIES = [
  { id: 'essentials', name: 'Essentials', pct: 10, color: '#6B7B58', goals: [], recurring: [] },
  { id: 'guiltfree', name: 'Guilt-Free', pct: 5, color: '#C9A227', goals: [], recurring: [] },
  { id: 'debtinvest', name: 'Debt / Invest', pct: 10, color: '#2F6F5E', goals: [], recurring: [] },
  { id: 'shortterm', name: 'Short-Term Buffer', pct: 15, color: '#B5651D', goals: [], recurring: [] },
  { id: 'longterm', name: 'Long-Term Wealth', pct: 15, color: '#3E5C76', goals: [], recurring: [] },
];

function monthKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
function monthLabel(key) {
  const [y, m] = key.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleString('en', { month: 'long', year: 'numeric' });
}
function formatGHS(n) {
  const sign = n < 0 ? '-' : '';
  return `${sign}GHC ${Math.abs(Math.round(n)).toLocaleString('en')}`;
}
function withDefaults(categories) {
  // ensures categories loaded from older saved data still have goals/recurring arrays
  return categories.map((c) => ({ goals: [], recurring: [], ...c }));
}

// ---- inline icon set ----
function IconHome({ color }) {
  return (<svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
    <path d="M3 9.5L10 3l7 6.5" /><path d="M5 8.5V17h4v-5h2v5h4V8.5" /></svg>);
}
function IconBudget({ color }) {
  return (<svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round">
    <line x1="3" y1="6" x2="17" y2="6" /><circle cx="11" cy="6" r="1.8" fill={color} stroke="none" />
    <line x1="3" y1="10" x2="17" y2="10" /><circle cx="7" cy="10" r="1.8" fill={color} stroke="none" />
    <line x1="3" y1="14" x2="17" y2="14" /><circle cx="13" cy="14" r="1.8" fill={color} stroke="none" /></svg>);
}
function IconGoals({ color }) {
  return (<svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke={color} strokeWidth="1.6">
    <circle cx="10" cy="10" r="7" /><circle cx="10" cy="10" r="4" /><circle cx="10" cy="10" r="1" fill={color} stroke="none" /></svg>);
}
function IconHistory({ color }) {
  return (<svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="10" cy="10" r="7" /><path d="M10 6.5v3.8l2.6 1.5" /></svg>);
}
function IconSettings({ color }) {
  return (<svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round">
    <circle cx="10" cy="10" r="2.6" />
    <path d="M10 2.6v2M10 15.4v2M17.4 10h-2M4.6 10h-2M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4M15.2 15.2l-1.4-1.4M6.2 6.2L4.8 4.8" /></svg>);
}
function IconPlus({ color }) {
  return (<svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round">
    <line x1="10" y1="4" x2="10" y2="16" /><line x1="4" y1="10" x2="16" y2="10" /></svg>);
}

function CustomSlider({ value, min, max, color, onChange }) {
  const trackRef = useRef(null);
  const draggingRef = useRef(false);
  const pct = ((value - min) / (max - min)) * 100;

  function valueFromClientX(clientX) {
    const rect = trackRef.current.getBoundingClientRect();
    let ratio = (clientX - rect.left) / rect.width;
    ratio = Math.max(0, Math.min(1, ratio));
    return Math.round(min + ratio * (max - min));
  }
  function handlePointerDown(e) {
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    draggingRef.current = true;
    onChange(valueFromClientX(e.clientX));
  }
  function handlePointerMove(e) { if (draggingRef.current) onChange(valueFromClientX(e.clientX)); }
  function handlePointerUp() { draggingRef.current = false; }

  return (
    <div ref={trackRef} style={{ position: 'relative', height: 28, width: '100%' }}>
      <div style={{ position: 'absolute', left: 0, right: 0, top: '50%', transform: 'translateY(-50%)', height: 4, borderRadius: 2, background: BORDER }} />
      <div style={{ position: 'absolute', left: 0, top: '50%', transform: 'translateY(-50%)', width: `${pct}%`, height: 4, borderRadius: 2, background: color }} />
      <div onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp}
        style={{ position: 'absolute', left: `${pct}%`, top: '50%', transform: 'translate(-50%, -50%)', width: 28, height: 28, borderRadius: '50%',
          display: 'flex', alignItems: 'center', justifyContent: 'center', touchAction: 'none', cursor: 'pointer' }}>
        <div style={{ width: 18, height: 18, borderRadius: '50%', background: color, border: '2px solid #FFF', boxShadow: '0 1px 4px rgba(0,0,0,0.25)' }} />
      </div>
    </div>
  );
}

function ProgressBar({ pct, color, height = 6 }) {
  const clamped = Math.min(100, Math.max(0, pct));
  return (
    <div style={{ background: BORDER, borderRadius: height / 2, height, overflow: 'hidden' }}>
      <div style={{ width: `${clamped}%`, background: color, height: '100%', transition: 'width 300ms ease' }} />
    </div>
  );
}

const inputStyle = { border: `1px solid ${BORDER}`, borderRadius: 6, padding: '8px', fontSize: '0.85rem', width: '100%' };

function TypeToggle({ value, onChange, color }) {
  const options = [{ v: 'expense', label: 'Expense' }, { v: 'income', label: 'Income' }];
  return (
    <div style={{ display: 'flex', border: `1px solid ${BORDER}`, borderRadius: 6, overflow: 'hidden' }}>
      {options.map((opt) => (
        <button key={opt.v} type="button" onClick={() => onChange(opt.v)}
          style={{
            flex: 1, padding: '7px 0', fontSize: '0.8rem', border: 'none', cursor: 'pointer',
            background: value === opt.v ? color : 'transparent',
            color: value === opt.v ? '#FFF' : MUTED,
          }}>
          {opt.label}
        </button>
      ))}
    </div>
  );
}
const settingsBtnStyle = { textAlign: 'left', background: CARD, border: `1px solid ${BORDER}`, borderRadius: 8, padding: '12px 16px', fontSize: '0.9rem', cursor: 'pointer', color: INK };

function categoryLabel(t, categories) {
  if (t.categoryId) {
    const cat = categories.find((c) => c.id === t.categoryId);
    return cat ? cat.name : 'Unknown';
  }
  return t.type === 'income' ? 'Unplanned income' : 'Unknown';
}

// When the total pool (salary + unplanned income) changes size, shrink or grow every
// category's percentage just enough to keep its dollar amount exactly the same as before —
// this quietly frees up (or reclaims) real percentage room without moving any money on its own.
function rescaleForPoolChange(cats, oldPool, newPool) {
  if (!oldPool || oldPool <= 0 || !newPool || newPool <= 0) return cats;
  const ratio = oldPool / newPool;
  return cats.map((c) => ({ ...c, pct: c.pct * ratio }));
}

function Ledger() {
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState(false);
  const [income, setIncome] = useState(3500);
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [months, setMonths] = useState({});
  const [activeMonth, setActiveMonth] = useState(monthKey(new Date()));
  const [activeTab, setActiveTab] = useState('home');

  // add-entry form (used by per-category form + home quick-add sheet)
  const [openForm, setOpenForm] = useState(null); // categoryId, or 'quickadd', or null
  const [formAmount, setFormAmount] = useState('');
  const [formNote, setFormNote] = useState('');
  const [formCategoryId, setFormCategoryId] = useState(null);
  const [formGoalId, setFormGoalId] = useState('');
  const [formType, setFormType] = useState('expense'); // 'expense' | 'income'
  const [formIncomeDest, setFormIncomeDest] = useState('unplanned'); // used by the quick-add sheet in Income mode

  const [editingNameId, setEditingNameId] = useState(null);
  const [nameDraft, setNameDraft] = useState('');

  // inline "new goal" / "new recurring" forms, keyed by categoryId
  const [newGoalFor, setNewGoalFor] = useState(null);
  const [newGoalName, setNewGoalName] = useState('');
  const [newGoalTarget, setNewGoalTarget] = useState('');
  const [newRecurringFor, setNewRecurringFor] = useState(null);
  const [newRecurringName, setNewRecurringName] = useState('');
  const [newRecurringAmount, setNewRecurringAmount] = useState('');

  // goal contribution sheet
  const [contributeGoal, setContributeGoal] = useState(null); // { categoryId, goalId, goalName, color }
  const [contributeAmount, setContributeAmount] = useState('');

  const [restoreMsg, setRestoreMsg] = useState('');
  const importInputRef = useRef(null);
  const [recurringMode, setRecurringMode] = useState('auto'); // 'auto' | 'confirm'

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          if (parsed.income) setIncome(parsed.income);
          if (parsed.categories) setCategories(withDefaults(parsed.categories));
          if (parsed.months) setMonths(parsed.months);
          if (parsed.recurringMode) setRecurringMode(parsed.recurringMode);
        } else {
          for (const oldKey of ['ledger-state-v2', 'ledger-state-v1']) {
            const old = await window.storage.get(oldKey, false).catch(() => null);
            if (old && old.value) {
              const parsed = JSON.parse(old.value);
              if (parsed.income) setIncome(parsed.income);
              if (parsed.categories) setCategories(withDefaults(parsed.categories));
              if (parsed.months) setMonths(parsed.months);
              break;
            }
          }
        }
      } catch (e) {}
      finally { setLoading(false); }
    })();
  }, []);

  const persist = useCallback(async (nextIncome, nextCategories, nextMonths, nextRecurringMode) => {
    try {
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify({
        income: nextIncome, categories: nextCategories, months: nextMonths,
        recurringMode: nextRecurringMode !== undefined ? nextRecurringMode : recurringMode,
      }), false);
      setSaveError(!result);
    } catch (e) { setSaveError(true); }
  }, [recurringMode]);

  function handleRecurringModeChange(mode) {
    setRecurringMode(mode);
    persist(income, categories, months, mode);
  }

  // find recurring items not yet logged for the active month
  function pendingRecurringItems() {
    const withMonth = ensureMonth(activeMonth, months);
    const existing = withMonth[activeMonth].transactions;
    const skipped = withMonth[activeMonth].skippedRecurring || [];
    const pending = [];
    categories.forEach((c) => {
      (c.recurring || []).forEach((r) => {
        const already = existing.some((t) => t.recurringId === r.id);
        const wasSkipped = skipped.includes(r.id);
        if (!already && !wasSkipped) pending.push({ ...r, categoryId: c.id, categoryColor: c.color });
      });
    });
    return pending;
  }

  function logPendingRecurring(item) {
    const withMonth = ensureMonth(activeMonth, months);
    const tx = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      categoryId: item.categoryId, amount: item.amount, note: item.name,
      date: new Date().toISOString(), recurringId: item.id,
    };
    const nextMonths = { ...withMonth, [activeMonth]: { ...withMonth[activeMonth], transactions: [tx, ...withMonth[activeMonth].transactions] } };
    setMonths(nextMonths); persist(income, categories, nextMonths);
  }

  function skipPendingRecurring(item) {
    const withMonth = ensureMonth(activeMonth, months);
    const current = withMonth[activeMonth].skippedRecurring || [];
    const nextMonths = { ...withMonth, [activeMonth]: { ...withMonth[activeMonth], skippedRecurring: [...current, item.id] } };
    setMonths(nextMonths); persist(income, categories, nextMonths);
  }

  // auto-log recurring costs for the active month (only when mode is 'auto')
  useEffect(() => {
    if (loading || recurringMode !== 'auto') return;
    const withMonth = ensureMonth(activeMonth, months);
    const existing = withMonth[activeMonth].transactions;
    const toAdd = [];
    categories.forEach((c) => {
      (c.recurring || []).forEach((r) => {
        const already = existing.some((t) => t.recurringId === r.id);
        if (!already) {
          toAdd.push({
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
            categoryId: c.id, amount: r.amount, note: r.name,
            date: new Date().toISOString(), recurringId: r.id,
          });
        }
      });
    });
    if (toAdd.length > 0) {
      const nextMonths = { ...withMonth, [activeMonth]: { ...withMonth[activeMonth], transactions: [...toAdd, ...withMonth[activeMonth].transactions] } };
      setMonths(nextMonths);
      persist(income, categories, nextMonths);
    }
    // eslint-disable-next-line
  }, [activeMonth, loading, recurringMode, categories.map(c => (c.recurring || []).map(r => r.id).join(',')).join('|')]);

  function handleIncomeChange(value) {
    const n = Math.max(0, Number(value) || 0);
    setIncome(n); persist(n, categories, months);
  }
  function handlePctChange(id, value) {
    const n = Math.max(0, Math.min(100, Number(value)));
    const next = categories.map((c) => (c.id === id ? { ...c, pct: n } : c));
    setCategories(next); persist(income, next, months);
  }
  function startRename(c) { setEditingNameId(c.id); setNameDraft(c.name); }
  function commitRename(id) {
    const trimmed = nameDraft.trim();
    const next = categories.map((c) => (c.id === id ? { ...c, name: trimmed || c.name } : c));
    setCategories(next); persist(income, next, months); setEditingNameId(null);
  }

  function ensureMonth(key, monthsObj) {
    if (monthsObj[key]) return monthsObj;
    return { ...monthsObj, [key]: { transactions: [], skippedRecurring: [] } };
  }

  function addTransaction(categoryId, goalId) {
    const amt = Number(formAmount);
    if (!amt || amt <= 0) return;
    // Whoever calls this decides the destination explicitly now:
    // categoryId=null means "unplanned" (sits in unaccounted), a real category id
    // means "boost that category directly" — no automatic inference here.
    const withMonth = ensureMonth(activeMonth, months);
    const tx = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      categoryId: categoryId || null, amount: amt, note: formNote.trim(), date: new Date().toISOString(),
      goalId: goalId || undefined, type: formType,
    };
    const nextMonths = { ...withMonth, [activeMonth]: { ...withMonth[activeMonth], transactions: [tx, ...withMonth[activeMonth].transactions] } };

    // Unplanned income grows the total pool — rescale category percentages so
    // dollar amounts stay frozen, freeing real slider room instead of auto-absorbing.
    let nextCategories = categories;
    if (tx.type === 'income' && !tx.categoryId) {
      const priorManualIncome = withMonth[activeMonth].transactions
        .filter((t) => t.type === 'income' && !t.categoryId)
        .reduce((s, t) => s + t.amount, 0);
      const oldPool = income + priorManualIncome;
      const newPool = oldPool + amt;
      nextCategories = rescaleForPoolChange(categories, oldPool, newPool);
      setCategories(nextCategories);
    }

    setMonths(nextMonths); persist(income, nextCategories, nextMonths);
    setFormAmount(''); setFormNote(''); setOpenForm(null); setFormCategoryId(null); setFormGoalId(''); setFormType('expense'); setFormIncomeDest('unplanned');
  }

  function handleQuickAddSave() {
    if (formType === 'expense') {
      addTransaction(formCategoryId, formGoalId || undefined);
      return;
    }
    // Income: resolve the "Where should this go?" selection into a categoryId/goalId
    if (formIncomeDest === 'unplanned') {
      addTransaction(null, undefined);
    } else if (formIncomeDest.startsWith('cat:')) {
      addTransaction(formIncomeDest.slice(4), undefined);
    } else if (formIncomeDest.startsWith('goal:')) {
      const gid = formIncomeDest.slice(5);
      const g = allGoals.find((x) => x.id === gid);
      addTransaction(g ? g.categoryId : null, gid);
    } else {
      addTransaction(null, undefined);
    }
  }

  function addGoalContribution() {
    const amt = Number(contributeAmount);
    if (!amt || amt <= 0 || !contributeGoal) return;
    const withMonth = ensureMonth(activeMonth, months);
    const tx = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      categoryId: contributeGoal.categoryId, amount: amt, note: `Toward: ${contributeGoal.goalName}`,
      date: new Date().toISOString(), goalId: contributeGoal.goalId,
    };
    const nextMonths = { ...withMonth, [activeMonth]: { ...withMonth[activeMonth], transactions: [tx, ...withMonth[activeMonth].transactions] } };
    setMonths(nextMonths); persist(income, categories, nextMonths);
    setContributeAmount(''); setContributeGoal(null);
  }

  function deleteTransaction(txId) {
    const list = months[activeMonth]?.transactions || [];
    const removed = list.find((t) => t.id === txId);
    const nextMonths = { ...months, [activeMonth]: { ...months[activeMonth], transactions: list.filter((t) => t.id !== txId) } };

    let nextCategories = categories;
    if (removed && removed.type === 'income' && !removed.categoryId) {
      const manualIncomeIncludingThis = list
        .filter((t) => t.type === 'income' && !t.categoryId)
        .reduce((s, t) => s + t.amount, 0);
      const oldPool = income + manualIncomeIncludingThis;
      const newPool = oldPool - removed.amount;
      nextCategories = rescaleForPoolChange(categories, oldPool, newPool);
      setCategories(nextCategories);
    }

    setMonths(nextMonths); persist(income, nextCategories, nextMonths);
  }

  function addGoal(categoryId) {
    const target = Number(newGoalTarget);
    if (!newGoalName.trim() || !target || target <= 0) return;
    const goal = { id: `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, name: newGoalName.trim(), target };
    const next = categories.map((c) => (c.id === categoryId ? { ...c, goals: [...(c.goals || []), goal] } : c));
    setCategories(next); persist(income, next, months);
    setNewGoalFor(null); setNewGoalName(''); setNewGoalTarget('');
  }
  function deleteGoal(categoryId, goalId) {
    const next = categories.map((c) => (c.id === categoryId ? { ...c, goals: (c.goals || []).filter((g) => g.id !== goalId) } : c));
    setCategories(next); persist(income, next, months);
  }

  function addRecurring(categoryId) {
    const amount = Number(newRecurringAmount);
    if (!newRecurringName.trim() || !amount || amount <= 0) return;
    const item = { id: `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, name: newRecurringName.trim(), amount };
    const next = categories.map((c) => (c.id === categoryId ? { ...c, recurring: [...(c.recurring || []), item] } : c));
    setCategories(next); persist(income, next, months);
    setNewRecurringFor(null); setNewRecurringName(''); setNewRecurringAmount('');
  }
  function deleteRecurring(categoryId, recurringId) {
    const next = categories.map((c) => (c.id === categoryId ? { ...c, recurring: (c.recurring || []).filter((r) => r.id !== recurringId) } : c));
    setCategories(next); persist(income, next, months);
  }

  function goalSaved(goalId) {
    let total = 0;
    Object.values(months).forEach((m) => {
      (m.transactions || []).forEach((t) => { if (t.goalId === goalId) total += t.amount; });
    });
    return total;
  }

  async function handleReset() {
    if (!window.confirm('Clear all saved ledger data? This cannot be undone.')) return;
    setIncome(3500); setCategories(DEFAULT_CATEGORIES); setMonths({}); setActiveMonth(monthKey(new Date()));
    try { await window.storage.delete(STORAGE_KEY, false); } catch (e) {}
  }

  function downloadBlob(content, type, filename) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function handleExportCSV() {
    const rows = [['Month', 'Date', 'Type', 'Category', 'Amount (GHC)', 'Note']];
    Object.keys(months).sort().forEach((mKey) => {
      (months[mKey]?.transactions || []).slice().reverse().forEach((t) => {
        const cat = categories.find((c) => c.id === t.categoryId);
        rows.push([mKey, new Date(t.date).toLocaleDateString('en-GB'), t.type === 'income' ? 'Income' : 'Expense', categoryLabel(t, categories), t.amount, `"${(t.note || '').replace(/"/g, '""')}"`]);
      });
    });
    downloadBlob(rows.map((r) => r.join(',')).join('\n'), 'text/csv;charset=utf-8;', `ledger-export-${monthKey(new Date())}.csv`);
  }
  function handleExportBackup() {
    downloadBlob(JSON.stringify({ income, categories, months, exportedAt: new Date().toISOString() }, null, 2), 'application/json', `ledger-backup-${monthKey(new Date())}.json`);
  }
  function handleImportClick() { importInputRef.current?.click(); }
  function handleImportFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (typeof parsed.income !== 'number' || !Array.isArray(parsed.categories) || typeof parsed.months !== 'object') throw new Error('shape');
        setIncome(parsed.income); setCategories(withDefaults(parsed.categories)); setMonths(parsed.months);
        persist(parsed.income, withDefaults(parsed.categories), parsed.months);
        setRestoreMsg('Backup restored successfully.');
      } catch (err) { setRestoreMsg("That file doesn't look like a valid ledger backup."); }
      setTimeout(() => setRestoreMsg(''), 4000);
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  const currentTx = months[activeMonth]?.transactions || [];

  // rescaled the moment it's logged (see addTransaction), so this doesn't silently inflate
  // any category's dollar amount — it just makes real slider room available to claim.
  const manualIncomeThisMonth = currentTx.filter((t) => t.type === 'income' && !t.categoryId).reduce((s, t) => s + t.amount, 0);
  const totalPool = income + manualIncomeThisMonth;
  const totalPlanned = totalPool * (Math.min(totalAllocatedPct, 100) / 100);
  const unallocatedAmount = totalPool - totalPlanned;
  const totalSpent = currentTx.filter((t) => t.type !== 'income').reduce((s, t) => s + t.amount, 0);
  const totalIncomeThisMonth = currentTx.filter((t) => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  const totalIncomeAllTime = Object.values(months).reduce(
    (sum, m) => sum + (m.transactions || []).filter((t) => t.type === 'income').reduce((s, t) => s + t.amount, 0), 0

  const availableMonths = Array.from(new Set([...Object.keys(months), monthKey(new Date())])).sort();
  const monthIdx = availableMonths.indexOf(activeMonth);

          </div>
        )}

        {activeTab === 'settings' && (
          <div style={pageStyle}>
            <h1 style={pageTitleStyle}>Settings</h1>

            <div style={{ marginBottom: 28, background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: 20 }}>
              <p style={{ color: MUTED, fontSize: '0.8rem', margin: '0 0 4px' }}>Side income, all time</p>
              <p style={{ fontFamily: SERIF, fontSize: '1.8rem', fontWeight: 500, margin: 0, color: totalIncomeAllTime > 0 ? GOLD : INK }}>{formatGHS(totalIncomeAllTime)}</p>
              <p style={{ color: MUTED, fontSize: '0.75rem', margin: '6px 0 0' }}>Every entry logged as "Income" across every month, added up.</p>
            </div>

            <div style={{ marginBottom: 28 }}>
              <h2 style={{ fontFamily: SERIF, fontSize: '1rem', fontWeight: 600, marginBottom: 10 }}>Recurring costs</h2>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {[
                  { value: 'auto', label: 'Add automatically', hint: 'Recurring costs log themselves each month, no action needed.' },
                  { value: 'confirm', label: 'Ask me to confirm', hint: 'You\u2019ll get a prompt on Home each month to approve or skip each one.' },
                ].map((opt) => (
                  <label key={opt.value} style={{ display: 'flex', gap: 10, alignItems: 'flex-start', background: CARD, border: `1px solid ${recurringMode === opt.value ? FOREST : BORDER}`, borderRadius: 8, padding: '12px 14px', cursor: 'pointer' }}>
                    <input type="radio" name="recurringMode" checked={recurringMode === opt.value} onChange={() => handleRecurringModeChange(opt.value)} style={{ marginTop: 3 }} />
                    <div>
                      <p style={{ margin: 0, fontSize: '0.9rem', fontWeight: 500 }}>{opt.label}</p>
                      <p style={{ margin: '2px 0 0', fontSize: '0.78rem', color: MUTED }}>{opt.hint}</p>
                    </div>
                  </label>
                ))}
              </div>
            </div>

            <div style={{ marginBottom: 28 }}>
              <h2 style={{ fontFamily: SERIF, fontSize: '1rem', fontWeight: 600, marginBottom: 10 }}>Data</h2>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                <button onClick={handleExportCSV} style={settingsBtnStyle}>Export CSV</button>
                <button onClick={handleExportBackup} style={settingsBtnStyle}>Export full backup (JSON)</button>
                <button onClick={handleImportClick} style={settingsBtnStyle}>Restore from backup</button>
                <input ref={importInputRef} type="file" accept="application/json" onChange={handleImportFile} style={{ display: 'none' }} />
                {restoreMsg && <p style={{ color: restoreMsg.includes('valid') ? BRICK : FOREST, fontSize: '0.8rem', margin: '4px 0 0' }}>{restoreMsg}</p>}
              </div>
            </div>
            <div style={{ marginBottom: 28 }}>
              <h2 style={{ fontFamily: SERIF, fontSize: '1rem', fontWeight: 600, marginBottom: 10 }}>Reset</h2>
              <button onClick={handleReset} style={{ ...settingsBtnStyle, color: BRICK, borderColor: BRICK }}>Reset ledger</button>
            </div>
            <p style={{ color: saveError ? BRICK : MUTED, fontSize: '0.75rem' }}>{saveError ? "Couldn't save — check your connection" : 'Your data is saved automatically on this device.'}</p>
          </div>
        )}
      </div>

      {activeTab === 'home' && (
        <button onClick={() => { setOpenForm('quickadd'); setFormCategoryId(categories[0]?.id || null); setFormAmount(''); setFormNote(''); setFormGoalId(''); setFormType('expense'); setFormIncomeDest('unplanned'); }}
          style={{ position: 'fixed', bottom: 78, right: 20, width: 56, height: 56, borderRadius: '50%', background: FOREST, border: 'none',
            display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 14px rgba(28,43,34,0.25)', cursor: 'pointer', zIndex: 10 }}
          aria-label="Add entry">
          <IconPlus color="#FFF" />
        </button>
      )}

      {openForm === 'quickadd' && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(28,43,34,0.4)', display: 'flex', alignItems: 'flex-end', zIndex: 20 }} onClick={() => setOpenForm(null)}>
          <div style={{ background: CARD, width: '100%', borderRadius: '16px 16px 0 0', padding: 24 }} onClick={(e) => e.stopPropagation()}>
            <h3 style={{ fontFamily: SERIF, fontSize: '1.1rem', margin: '0 0 16px' }}>Add entry</h3>
            <div style={{ marginBottom: 12 }}><TypeToggle value={formType} onChange={setFormType} color={FOREST} /></div>

            {formType === 'expense' ? (
              <>
                <label style={{ color: MUTED, fontSize: '0.8rem' }}>Category</label>
                <select value={formCategoryId || ''} onChange={(e) => { setFormCategoryId(e.target.value); setFormGoalId(''); }} style={{ ...inputStyle, margin: '4px 0 12px' }}>
                  {categories.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </>
            ) : (
              <>
                <label style={{ color: MUTED, fontSize: '0.8rem' }}>Where should this go?</label>
                <select value={formIncomeDest} onChange={(e) => setFormIncomeDest(e.target.value)} style={{ ...inputStyle, margin: '4px 0 12px' }}>
                  <option value="unplanned">Unplanned — decide later</option>
                  <optgroup label="Add to a category">
                    {categories.map((c) => <option key={c.id} value={`cat:${c.id}`}>{c.name}</option>)}
                  </optgroup>
                  {allGoals.length > 0 && (
                    <optgroup label="Send to a goal">
                      {allGoals.map((g) => <option key={g.id} value={`goal:${g.id}`}>{g.name} ({g.categoryName})</option>)}
                    </optgroup>
                  )}
                </select>
              </>
            )}

            <input type="number" placeholder="Amount" value={formAmount} onChange={(e) => setFormAmount(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); handleQuickAddSave(); } }} autoFocus
              style={{ ...inputStyle, padding: '10px', marginBottom: 10 }} />
            <input type="text" placeholder={formType === 'income' ? 'Source (e.g. Bug bounty)' : 'Note (optional)'} value={formNote} onChange={(e) => setFormNote(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); handleQuickAddSave(); } }}
              style={{ ...inputStyle, padding: '10px', marginBottom: 10 }} />
            {formType === 'expense' && (categories.find((c) => c.id === formCategoryId)?.goals || []).length > 0 && (
              <select value={formGoalId} onChange={(e) => setFormGoalId(e.target.value)} style={{ ...inputStyle, padding: '10px', marginBottom: 16 }}>
                <option value="">Not toward a goal</option>
                {(categories.find((c) => c.id === formCategoryId)?.goals || []).map((g) => <option key={g.id} value={g.id}>Toward: {g.name}</option>)}
              </select>
            )}
            <div style={{ display: 'flex', gap: 10, marginTop: 6 }}>
              <button onClick={handleQuickAddSave} style={{ flex: 1, background: FOREST, color: '#FFF', border: 'none', borderRadius: 8, padding: '12px', fontSize: '0.9rem', cursor: 'pointer' }}>Save</button>
              <button onClick={() => { setOpenForm(null); setFormType('expense'); setFormIncomeDest('unplanned'); }} style={{ flex: 1, background: 'none', color: MUTED, border: `1px solid ${BORDER}`, borderRadius: 8, padding: '12px', fontSize: '0.9rem', cursor: 'pointer' }}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {contributeGoal && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(28,43,34,0.4)', display: 'flex', alignItems: 'flex-end', zIndex: 20 }} onClick={() => setContributeGoal(null)}>
          <div style={{ background: CARD, width: '100%', borderRadius: '16px 16px 0 0', padding: 24 }} onClick={(e) => e.stopPropagation()}>
            <h3 style={{ fontFamily: SERIF, fontSize: '1.1rem', margin: '0 0 16px' }}>Add funds to {contributeGoal.goalName}</h3>
            <input type="number" placeholder="Amount" value={contributeAmount} onChange={(e) => setContributeAmount(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addGoalContribution(); } }} autoFocus
              style={{ ...inputStyle, padding: '10px', marginBottom: 16 }} />
            <div style={{ display: 'flex', gap: 10 }}>
              <button onClick={addGoalContribution} style={{ flex: 1, background: contributeGoal.color, color: '#FFF', border: 'none', borderRadius: 8, padding: '12px', fontSize: '0.9rem', cursor: 'pointer' }}>Save</button>
              <button onClick={() => setContributeGoal(null)} style={{ flex: 1, background: 'none', color: MUTED, border: `1px solid ${BORDER}`, borderRadius: 8, padding: '12px', fontSize: '0.9rem', cursor: 'pointer' }}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      <nav style={{ position: 'fixed', bottom: 0, left: 0, right: 0, display: 'flex', borderTop: `1px solid ${BORDER}`, background: CARD, paddingBottom: 'env(safe-area-inset-bottom, 0px)', zIndex: 15 }}>
        {[
          { id: 'home', label: 'Home', Icon: IconHome },
          { id: 'budget', label: 'Budget', Icon: IconBudget },
          { id: 'goals', label: 'Goals', Icon: IconGoals },
          { id: 'history', label: 'History', Icon: IconHistory },
          { id: 'settings', label: 'Settings', Icon: IconSettings },
        ].map((tab) => {
          const active = activeTab === tab.id;
          const color = active ? FOREST : MUTED;
          return (
            <button key={tab.id} onClick={() => setActiveTab(tab.id)}
              style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2, padding: '10px 0', background: 'none', border: 'none', cursor: 'pointer' }}>
              <tab.Icon color={color} />
              <span style={{ fontSize: '0.68rem', color, fontWeight: active ? 600 : 400 }}>{tab.label}</span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Ledger />);
</script>

<script>
  // Manually transform with the classic JSX runtime (avoids an ES module
  // import that a plain script tag can't execute) and inject it.
  var src = document.getElementById('app-source').textContent;
  var output = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
  var s = document.createElement('script');
  s.textContent = output;
  document.body.appendChild(s);
</script>
</body>
</html>
